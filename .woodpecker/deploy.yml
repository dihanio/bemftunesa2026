depends_on:
  - name: api
    optional: true
  - name: public
    optional: true
  - name: ims
    optional: true
  - name: pkkmb
    optional: true
steps:
  - name: deploy
    image: alpine:3.20
    environment:
      VPS_HOST:
        from_secret: vps_host
      VPS_PORT:
        from_secret: vps_port
      VPS_USER:
        from_secret: vps_user
      VPS_DEPLOY_KEY:
        from_secret: vps_deploy_key
      VPS_COMPOSE_PROJECT:
        from_secret: vps_compose_project
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - >-
        ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30
        -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST"
        "set -euo pipefail && cd '$VPS_COMPOSE_PROJECT' &&
        echo '$GITHUB_TOKEN' | docker login ghcr.io -u dihanio --password-stdin &&
        git fetch --all --prune && git reset --hard '$CI_COMMIT_SHA' &&
        chmod +x ./scripts/deploy/vps_deploy.sh &&
        DEPLOY_PATH='$VPS_COMPOSE_PROJECT' ./scripts/deploy/vps_deploy.sh '$CI_COMMIT_SHA'"
    when:
      - event: push
        branch: main
        path:
          include: [backend/**, frontend/**, ims/**, pkkmb/**, packages/**, package.json, package-lock.json, turbo.json, Dockerfile.backend, Dockerfile.frontend, docker-compose.yml, scripts/deploy/**, Caddyfile]
