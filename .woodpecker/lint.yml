steps:
  - name: lint
    image: node:22-bookworm-slim
    commands:
      - npm ci
      - npx turbo run lint
    when:
      - event: [push, tag]
      - event: pull_request
        branch:
          exclude: [dependabot/**, renovate/**]

  - name: build-check
    image: node:22-bookworm-slim
    environment:
      NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
      NEXT_PUBLIC_PUBLIC_URL: https://example.com
      NEXT_PUBLIC_IMS_URL: https://ims.example.com
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy-client-id
    commands:
      - npm ci
      - npx turbo run build --filter=@bemft/backend --filter=@bemft/frontend --filter=@bemft/ims --filter=@bemft/pkkmb
    when:
      - event: pull_request
        branch:
          exclude: [dependabot/**, renovate/**]
