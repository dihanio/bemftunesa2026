# Woodpecker CI/CD — build + push image ke GHCR + deploy ke VPS via SSH
#
# Alur pipeline:
#   pull_request  : lint + build-check (validasi kode, tidak push image)
#   push ke main  : lint + push 4 Docker images ke GHCR + deploy ke VPS
#
# Secrets yang harus di-set di Woodpecker repo settings:
#   github_token           : GitHub PAT (scope: write:packages, read:packages, repo)
#   vps_host               : IP/hostname VPS
#   vps_port               : port SSH VPS
#   vps_user               : user SSH VPS
#   vps_deploy_key         : private key SSH untuk login ke VPS
#   vps_compose_project    : path absolut folder project di VPS
#   next_public_api_url    : contoh https://api.bemftunesa.org/api/v1
#   next_public_public_url : contoh https://bemftunesa.org
#   next_public_ims_url    : contoh https://ims.bemftunesa.org
#   next_public_google_client_id : Google OAuth Client ID

steps:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  - name: lint
    image: node:22-bookworm-slim
    commands:
      - corepack enable || true
      - npm ci
      - npm run lint --workspaces --if-present || true
    when:
      event: [push, pull_request, tag]

  # ── 2. Build check – hanya saat pull_request ──────────────────────────────
  - name: build-check
    image: node:22-bookworm-slim
    commands:
      - corepack enable || true
      - npm ci
      - npx turbo run build --filter=@bemft/backend --filter=@bemft/frontend --filter=@bemft/ims --filter=@bemft/pkkmb
    when:
      event: pull_request

  # ── 3. Push Docker image – backend ────────────────────────────────────────
  - name: push-api
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: ghcr.io/dihanio/bemftunesa2026-api
      registry: ghcr.io
      username: dihanio
      password:
        from_secret: github_token
      dockerfile: Dockerfile.backend
      auto_tag: true
      target: runner
    when:
      event: [push, tag]
      branch: [main]

  # ── 4. Push Docker image – public web ─────────────────────────────────────
  - name: push-public-web
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: ghcr.io/dihanio/bemftunesa2026-public_web
      registry: ghcr.io
      username: dihanio
      password:
        from_secret: github_token
      dockerfile: Dockerfile.frontend
      auto_tag: true
      target: runner
      build_args_from_env:
        - NEXT_PUBLIC_API_URL
        - NEXT_PUBLIC_PUBLIC_URL
        - NEXT_PUBLIC_IMS_URL
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID
      build_args:
        - APP_NAME=frontend
    secrets:
      - source: next_public_api_url
        target: NEXT_PUBLIC_API_URL
      - source: next_public_public_url
        target: NEXT_PUBLIC_PUBLIC_URL
      - source: next_public_ims_url
        target: NEXT_PUBLIC_IMS_URL
      - source: next_public_google_client_id
        target: NEXT_PUBLIC_GOOGLE_CLIENT_ID
    when:
      event: [push, tag]
      branch: [main]

  # ── 5. Push Docker image – IMS dashboard ──────────────────────────────────
  - name: push-ims-web
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: ghcr.io/dihanio/bemftunesa2026-ims_web
      registry: ghcr.io
      username: dihanio
      password:
        from_secret: github_token
      dockerfile: Dockerfile.frontend
      auto_tag: true
      target: runner
      build_args_from_env:
        - NEXT_PUBLIC_API_URL
        - NEXT_PUBLIC_PUBLIC_URL
        - NEXT_PUBLIC_IMS_URL
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID
      build_args:
        - APP_NAME=ims
    secrets:
      - source: next_public_api_url
        target: NEXT_PUBLIC_API_URL
      - source: next_public_public_url
        target: NEXT_PUBLIC_PUBLIC_URL
      - source: next_public_ims_url
        target: NEXT_PUBLIC_IMS_URL
      - source: next_public_google_client_id
        target: NEXT_PUBLIC_GOOGLE_CLIENT_ID
    when:
      event: [push, tag]
      branch: [main]

  # ── 6. Push Docker image – PKKMB portal ───────────────────────────────────
  - name: push-pkkmb-web
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: ghcr.io/dihanio/bemftunesa2026-pkkmb_web
      registry: ghcr.io
      username: dihanio
      password:
        from_secret: github_token
      dockerfile: Dockerfile.frontend
      auto_tag: true
      target: runner
      build_args_from_env:
        - NEXT_PUBLIC_API_URL
        - NEXT_PUBLIC_PUBLIC_URL
        - NEXT_PUBLIC_IMS_URL
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID
      build_args:
        - APP_NAME=pkkmb
    secrets:
      - source: next_public_api_url
        target: NEXT_PUBLIC_API_URL
      - source: next_public_public_url
        target: NEXT_PUBLIC_PUBLIC_URL
      - source: next_public_ims_url
        target: NEXT_PUBLIC_IMS_URL
      - source: next_public_google_client_id
        target: NEXT_PUBLIC_GOOGLE_CLIENT_ID
    when:
      event: [push, tag]
      branch: [main]

  # ── 7. Deploy ke VPS via SSH ───────────────────────────────────────────────
  - name: deploy
    image: alpine:latest
    secrets:
      - source: vps_host
        target: VPS_HOST
      - source: vps_port
        target: VPS_PORT
      - source: vps_user
        target: VPS_USER
      - source: vps_deploy_key
        target: VPS_DEPLOY_KEY
      - source: vps_compose_project
        target: VPS_COMPOSE_PROJECT
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - |
        ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
          set -e
          cd '$VPS_COMPOSE_PROJECT' || { echo 'ERROR: folder tidak ditemukan'; exit 1; }
          git fetch origin
          git reset --hard origin/main
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
        "
    when:
      event: push
      branch: [main]
