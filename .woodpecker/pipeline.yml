# Woodpecker CI/CD — lint + build + push image ke GHCR + deploy ke VPS via SSH
#
# Alur pipeline:
#   pull_request  : lint + build-check (validasi kode, tidak push image)
#   push ke main  : lint + push 4 Docker images ke GHCR + deploy ke VPS
#   tag (v*.*.*)  : lint + push 4 Docker images ke GHCR (tidak deploy)
#
# Secrets yang WAJIB diisi di Woodpecker → repo settings → Secrets:
#
#   github_token              GitHub PAT (scope: write:packages, read:packages)
#   vps_host                  IP atau hostname VPS
#   vps_port                  Port SSH (biasanya 22)
#   vps_user                  Username SSH di VPS
#   vps_deploy_key            Isi teks private key SSH (bukan path file)
#   vps_compose_project       Path absolut folder project di VPS
#                             contoh: /home/deploy/bemft-unesa-web
#   next_public_api_url       contoh: https://api.bemftunesa.org/api/v1
#   next_public_public_url    contoh: https://bemftunesa.org
#   next_public_ims_url       contoh: https://ims.bemftunesa.org
#   next_public_google_client_id  Google OAuth Client ID

steps:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  # Jalankan di semua event kecuali Dependabot/automated dependency PRs.
  # Pipeline GAGAL jika ada lint error.
  - name: lint
    image: node:22-bookworm-slim
    commands:
      - npm ci
      - npx turbo run lint
    when:
      - event: [push, tag]
      - event: pull_request
        branch:
          exclude: [dependabot/**, renovate/**]

  # ── 2. Build check – hanya saat pull_request ──────────────────────────────
  # Pastikan semua workspace bisa di-build sebelum merge ke main.
  # Env NEXT_PUBLIC_* diisi dummy agar Next.js tidak error saat build.
  - name: build-check
    image: node:22-bookworm-slim
    environment:
      NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
      NEXT_PUBLIC_PUBLIC_URL: https://example.com
      NEXT_PUBLIC_IMS_URL: https://ims.example.com
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy-client-id
    commands:
      - npm ci
      - >-
        npx turbo run build
        --filter=@bemft/backend
        --filter=@bemft/frontend
        --filter=@bemft/ims
        --filter=@bemft/pkkmb
    when:
      - event: pull_request
        branch:
          exclude: [dependabot/**, renovate/**]

  # ── 3. Push Docker image – backend (NestJS API) ───────────────────────────
  - name: push-api
    depends_on: [lint]
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      repo: ghcr.io/dihanio/bemftunesa2026-api
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
      registry: ghcr.io
      username: dihanio
      password:
        from_secret: github_token
      dockerfile: Dockerfile.backend
      target: runner
      platforms:
        - linux/amd64
      cache_from: ghcr.io/dihanio/bemftunesa2026-api:buildcache
      cache_to: "type=registry,ref=ghcr.io/dihanio/bemftunesa2026-api:buildcache,mode=min"
    when:
      - event: [push, tag]
        branch: main

  # ── 4. Push Docker image – public web (Next.js) ───────────────────────────
  - name: push-public-web
    depends_on: [lint]
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      repo: ghcr.io/dihanio/bemftunesa2026-public_web
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
      registry: ghcr.io
      username: dihanio
      password:
        from_secret: github_token
      dockerfile: Dockerfile.frontend
      target: runner
      platforms:
        - linux/amd64
      # build_args_from_env membaca nilai dari environment: block di bawah
      build_args:
        APP_NAME: frontend
      cache_from: ghcr.io/dihanio/bemftunesa2026-public_web:buildcache
      cache_to: "type=registry,ref=ghcr.io/dihanio/bemftunesa2026-public_web:buildcache,mode=min"
    when:
      - event: [push, tag]
        branch: main

  # ── 5. Push Docker image – IMS dashboard (Next.js) ────────────────────────
  - name: push-ims-web
    depends_on: [lint]
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      repo: ghcr.io/dihanio/bemftunesa2026-ims_web
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
      registry: ghcr.io
      username: dihanio
      password:
        from_secret: github_token
      dockerfile: Dockerfile.frontend
      target: runner
      platforms:
        - linux/amd64
      build_args:
        APP_NAME: ims
      cache_from: ghcr.io/dihanio/bemftunesa2026-ims_web:buildcache
      cache_to: "type=registry,ref=ghcr.io/dihanio/bemftunesa2026-ims_web:buildcache,mode=min"
    when:
      - event: [push, tag]
        branch: main

  # ── 6. Push Docker image – PKKMB portal (Next.js) ─────────────────────────
  - name: push-pkkmb-web
    depends_on: [lint]
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      repo: ghcr.io/dihanio/bemftunesa2026-pkkmb_web
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
      registry: ghcr.io
      username: dihanio
      password:
        from_secret: github_token
      dockerfile: Dockerfile.frontend
      target: runner
      platforms:
        - linux/amd64
      build_args:
        APP_NAME: pkkmb
      cache_from: ghcr.io/dihanio/bemftunesa2026-pkkmb_web:buildcache
      cache_to: "type=registry,ref=ghcr.io/dihanio/bemftunesa2026-pkkmb_web:buildcache,mode=min"
    when:
      - event: [push, tag]
        branch: main

  # ── 7. Deploy ke VPS via SSH ───────────────────────────────────────────────
  # Memanggil vps_deploy.sh yang sudah ada — mendukung change-detection
  # per-service, health-check, dan rollback otomatis.
  - name: deploy
    depends_on: [push-api, push-public-web, push-ims-web, push-pkkmb-web]
    image: alpine:3.20
    environment:
      VPS_HOST:
        from_secret: vps_host
      VPS_PORT:
        from_secret: vps_port
      VPS_USER:
        from_secret: vps_user
      VPS_DEPLOY_KEY:
        from_secret: vps_deploy_key
      VPS_COMPOSE_PROJECT:
        from_secret: vps_compose_project
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      # Tulis private key ke file (printf agar tidak ada trailing newline yang corrupt)
      - printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      # Simpan host key agar tidak ada interactive prompt
      - ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - >-
        ssh
        -o StrictHostKeyChecking=no
        -o BatchMode=yes
        -o ConnectTimeout=30
        -p "${VPS_PORT:-22}"
        "$VPS_USER@$VPS_HOST"
        "set -euo pipefail &&
         cd '$VPS_COMPOSE_PROJECT' &&
         echo '$GITHUB_TOKEN' | docker login ghcr.io -u dihanio --password-stdin &&
         git fetch --all --prune &&
         git reset --hard '$CI_COMMIT_SHA' &&
         chmod +x ./scripts/deploy/vps_deploy.sh &&
         DEPLOY_PATH='$VPS_COMPOSE_PROJECT' ./scripts/deploy/vps_deploy.sh '$CI_COMMIT_SHA'"
    when:
      - event: push
        branch: main
