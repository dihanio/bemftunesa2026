#
# Postal v3 - Self-hosted email server for BEM FT UNESA
# Usage: docker compose up -d
#
# Initial setup:
#   1. Configure DNS — see docs/EMAIL_SETUP.md
#   2. docker compose up -d postal-db
#   3. docker compose run --rm postal-web postal initialize
#   4. docker compose run --rm postal-web postal make-user
#   5. docker compose up -d
#   6. Access web UI at http://<VPS_IP>:5000
#
services:
  postal-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${POSTAL_DB_ROOT_PASSWORD:-postal_root_2026}
      MARIADB_DATABASE: postal
      MARIADB_USER: postal
      MARIADB_PASSWORD: ${POSTAL_DB_PASSWORD:-postal_pass_2026}
    volumes:
      - postal_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - postal

  postal-web:
    image: ghcr.io/postalserver/postal:3.3.7
    restart: unless-stopped
    command: postal web-server
    depends_on:
      postal-db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./config/postal:/config
    environment:
      - WAIT_FOR_TARGETS=postal-db:3306
    networks:
      - postal

  postal-smtp:
    image: ghcr.io/postalserver/postal:3.3.7
    restart: unless-stopped
    command: postal smtp-server
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      postal-db:
        condition: service_healthy
    ports:
      - "25:25"
    volumes:
      - ./config/postal:/config
    environment:
      - WAIT_FOR_TARGETS=postal-db:3306
    networks:
      - postal

  postal-worker:
    image: ghcr.io/postalserver/postal:3.3.7
    restart: unless-stopped
    command: postal worker
    depends_on:
      postal-db:
        condition: service_healthy
    volumes:
      - ./config/postal:/config
    environment:
      - WAIT_FOR_TARGETS=postal-db:3306
    networks:
      - postal

volumes:
  postal_db_data:

networks:
  postal:
    driver: bridge
