#
# Postal - Self-hosted email server for BEM FT UNESA
# Usage: docker compose up -d
#
# Initial setup:
#   1. Configure DNS (MX, SPF, DKIM, DMARC) — see docs/EMAIL_SETUP.md
#   2. Start services: docker compose up -d postal-db postal-rabbitmq
#   3. Generate signing key: docker compose run --rm postal postal init-postal
#   4. Create admin: docker compose run --rm postal postal make-user
#   5. Access web UI at http://<VPS_IP>:5000
#   6. Create a server in Postal UI, get API key and SMTP credentials
#   7. Add SMTP credentials to backend .env
#
services:
  postal-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${POSTAL_DB_ROOT_PASSWORD:-postal_root_2026}
      MARIADB_DATABASE: postal
      MARIADB_USER: postal
      MARIADB_PASSWORD: ${POSTAL_DB_PASSWORD:-postal_pass_2026}
    volumes:
      - postal_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - postal

  postal-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: postal
      RABBITMQ_DEFAULT_PASS: ${POSTAL_RABBITMQ_PASSWORD:-postal_rabbit_2026}
    volumes:
      - postal_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - postal

  postal:
    image: ghcr.io/postalserver/postal:2
    restart: unless-stopped
    depends_on:
      postal-db:
        condition: service_healthy
      postal-rabbitmq:
        condition: service_healthy
    ports:
      - "25:25"
      - "5000:5000"
    volumes:
      - postal_config:/config
      - postal_data:/app/data
    networks:
      - postal

volumes:
  postal_db_data:
  postal_rabbitmq_data:
  postal_config:
  postal_data:

networks:
  postal:
    driver: bridge
