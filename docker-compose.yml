services:
  # === API Backend (NestJS) ===
  api:
    image: ghcr.io/dihanio/bemftunesa2026-api:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      - PORT=4000
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/api/v1/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - uploads_data:/app/backend/public/uploads
    networks:
      - default
      - postal
    restart: unless-stopped

  # === Public Website (Next.js) ===
  public_web:
    image: ghcr.io/dihanio/bemftunesa2026-public_web:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_NAME: frontend
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PUBLIC_URL: ${NEXT_PUBLIC_PUBLIC_URL}
        NEXT_PUBLIC_IMS_URL: ${NEXT_PUBLIC_IMS_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => r.statusCode >= 200 && r.statusCode < 400 ? process.exit(0) : process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default
    restart: unless-stopped

  # === IMS Dashboard (Next.js) ===
  ims_web:
    image: ghcr.io/dihanio/bemftunesa2026-ims_web:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_NAME: ims
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PUBLIC_URL: ${NEXT_PUBLIC_PUBLIC_URL}
        NEXT_PUBLIC_IMS_URL: ${NEXT_PUBLIC_IMS_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/login', (r) => r.statusCode >= 200 && r.statusCode < 400 ? process.exit(0) : process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default
    restart: unless-stopped

  # === PKKMB Student Portal (Next.js) ===
  pkkmb_web:
    image: ghcr.io/dihanio/bemftunesa2026-pkkmb_web:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_NAME: pkkmb
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PUBLIC_URL: ${NEXT_PUBLIC_PUBLIC_URL}
        NEXT_PUBLIC_IMS_URL: ${NEXT_PUBLIC_IMS_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => r.statusCode >= 200 && r.statusCode < 400 ? process.exit(0) : process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default
    restart: unless-stopped

  # === Caddy Reverse Proxy (auto-SSL) ===
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      public_web:
        condition: service_healthy
      ims_web:
        condition: service_healthy
      pkkmb_web:
        condition: service_healthy
    networks:
      - default

  # === Database (MongoDB 6) ===
  db:
    image: mongo:6
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: bemft-cms
    volumes:
      - mongodb_data:/data/db
    networks:
      - default

  # === Redis Cache ===
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data
    networks:
      - default
    command: redis-server --appendonly yes

  # === Postal Email Server ===
  postal-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${POSTAL_DB_ROOT_PASSWORD:-postal_root_2026}
      MYSQL_DATABASE: postal
      MYSQL_USER: postal
      MYSQL_PASSWORD: ${POSTAL_DB_PASSWORD:-postal_pass_2026}
    volumes:
      - postal_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - postal

  postal-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: postal
      RABBITMQ_DEFAULT_PASS: ${POSTAL_RABBITMQ_PASSWORD:-postal_rabbit_2026}
    volumes:
      - postal_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - postal

  postal:
    image: ghcr.io/postalserver/postal:2
    restart: unless-stopped
    depends_on:
      postal-db:
        condition: service_healthy
      postal-rabbitmq:
        condition: service_healthy
    ports:
      - "25:25"
      - "5000:5000"
    volumes:
      - ./config/postal:/config
      - postal_data:/app/data
    networks:
      - postal

volumes:
  caddy_data:
  caddy_config:
  mongodb_data:
  redis_data:
  uploads_data:
  postal_db_data:
  postal_rabbitmq_data:
  postal_data:

networks:
  postal:
    driver: bridge
