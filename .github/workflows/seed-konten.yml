name: Seed Konten PKKMB (Presensi, Penugasan, Quiz) — VPS

on:
  workflow_dispatch:

jobs:
  seed-konten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Seed konten PKKMB di VPS
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"

            echo "======================================================"
            echo "Seed konten PKKMB (presensi, penugasan, quiz)"
            echo "======================================================"

            docker compose -f docker-compose.yml exec -T api node dist/src/database/seeders/seed-konten-pkkmb.js

            echo ""
            echo "→ Verifikasi isi database:"
            docker compose -f docker-compose.yml exec -T api node -e '
              require("mongoose").connect(process.env.MONGODB_URI).then(async () => {
                const m = require("mongoose").connection.db;
                const sessions = await m.collection("pkkmb_attendance_sessions").countDocuments({ deletedAt: null });
                const tasks = await m.collection("pkkmb_tasks").countDocuments({ deletedAt: null });
                const quizzes = await m.collection("pkkmb_quizzes").countDocuments({ deletedAt: null });
                console.log("→ Sesi presensi: " + sessions);
                console.log("→ Penugasan (task): " + tasks);
                console.log("→ Quiz: " + quizzes);
                await require("mongoose").disconnect();
              });
            '
            echo "✅ Seed konten PKKMB selesai."
