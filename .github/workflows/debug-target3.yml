name: Debug isolasi query taskModel

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Isolasi filter taskModel
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"
            docker compose -f docker-compose.yml exec -T api node -e '
              const { NestFactory } = require("@nestjs/core");
              const { AppModule } = require("./dist/src/app.module");
              (async () => {
                const app = await NestFactory.createApplicationContext(AppModule, { logger: false });
                const PkkmbService = require("./dist/src/pkkmb/pkkmb.service").PkkmbService;
                const svc = app.get(PkkmbService);
                const m = svc.taskModel;
                const countAll = await m.countDocuments({});
                console.log("1. semua task ({}):", countAll);
                const countNotDeleted = await m.countDocuments({ deletedAt: null });
                console.log("2. deletedAt null:", countNotDeleted);
                const countPub = await m.countDocuments({ deletedAt: null, status: "PUBLISHED" });
                console.log("3. + status PUBLISHED:", countPub);
                const countAllTgt = await m.countDocuments({ deletedAt: null, status: "PUBLISHED", targetType: "ALL" });
                console.log("4. + targetType ALL:", countAllTgt);
                // tampilkan satu task utk lihat struktur
                const one = await m.findOne({}).lean().exec();
                console.log("5. contoh task:", JSON.stringify({ title: one.title, status: one.status, targetType: one.targetType, deletedAt: one.deletedAt, _id: String(one._id) }));
                await app.close();
                process.exit(0);
              })().catch(e => { console.error("FATAL", e.message); process.exit(1); });
            '
