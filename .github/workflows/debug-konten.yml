name: Verifikasi Konten PKKMB (Debug)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Query DB PKKMB
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"
            MDB_URI=$(grep -E '^MONGODB_URI=' .env | head -n1 | cut -d= -f2-)
            echo "== tasks =="
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval 'db.pkkmb_tasks.find({ deletedAt: null }, { title: 1, status: 1, assignmentType: 1, targetType: 1, deadline: 1 }).sort({ createdAt: -1 }).limit(10).toArray()'
            echo "== quizzes =="
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval 'db.pkkmb_quizzes.find({ deletedAt: null }, { title: 1, status: 1, type: 1, startTime: 1, endTime: 1 }).sort({ createdAt: -1 }).limit(10).toArray()'
            echo "== cari user Fibrian =="
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval 'db.users.find({ name: /FIBRIAN/i }, { name: 1, email: 1, role: 1, pkkmbGroup: 1, studyProgram: 1, isOnboarded: 1 }).toArray()'
