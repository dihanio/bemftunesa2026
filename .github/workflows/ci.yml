name: CI Build & Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/bemftunesa2026

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      ims: ${{ steps.filter.outputs.ims }}
      pkkmb: ${{ steps.filter.outputs.pkkmb }}
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
      public_web: ${{ steps.filter.outputs.public_web }}
      ims_web: ${{ steps.filter.outputs.ims_web }}
      pkkmb_web: ${{ steps.filter.outputs.pkkmb_web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # --- app-directory filters (preserved for lint-and-test) ---
            frontend:
              - 'frontend/**'
            ims:
              - 'ims/**'
            pkkmb:
              - 'pkkmb/**'
            backend:
              - 'backend/**'
            shared:
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile.*'
              - '.github/workflows/**'

            # --- per-service build triggers ---
            # Each filter group is TRUE when ANY listed path changes.
            # App dirs only affect their own service:
            #   frontend/** -> public_web, ims/** -> ims_web,
            #   pkkmb/** -> pkkmb_web, backend/** -> api.
            #
            # Shared files are mapped to the services that actually consume them
            # (analyzed from the repo):
            #   - packages/** (@bemft/permissions, @bemft/types) -> api ONLY
            #     (only backend depends on these workspace packages)
            #   - Dockerfile.frontend -> the 3 frontend services
            #   - Dockerfile.backend  -> api
            #   - package.json / package-lock.json / turbo.json (root workspace
            #     + lockfile + turbo task config) -> all services
            public_web:
              - 'frontend/**'
              - 'Dockerfile.frontend'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            ims_web:
              - 'ims/**'
              - 'Dockerfile.frontend'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            pkkmb_web:
              - 'pkkmb/**'
              - 'Dockerfile.frontend'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            api:
              - 'backend/**'
              - 'packages/**'
              - 'Dockerfile.backend'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'

  lint-and-test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Lint All
        run: npx turbo run lint

      - name: Test Backend
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
        run: npx turbo run test --filter=@bemft/backend

      - name: Test Pkkmb
        if: needs.changes.outputs.pkkmb == 'true' || needs.changes.outputs.shared == 'true'
        run: npx turbo run test --filter=@bemft/pkkmb

  # ---------------------------------------------------------------------------
  # Selective build: one job per service. Each job only runs when BOTH the
  # standard push/tag gate is met AND its service was actually affected
  # (detected in the `changes` job). Unaffected services are skipped entirely
  # by GitHub Actions via the job-level `if` — the matrix+step-skip pattern is
  # removed so skipped services do not even spawn a runner.
  # ---------------------------------------------------------------------------
  build-public-web:
    name: build-and-push (public_web)
    needs: [changes, lint-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.changes.outputs.public_web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-public_web
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=frontend
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_PUBLIC_URL=${{ vars.NEXT_PUBLIC_PUBLIC_URL }}
            NEXT_PUBLIC_IMS_URL=${{ vars.NEXT_PUBLIC_IMS_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ github.ref }}-public_web
          cache-to: type=gha,mode=max,scope=${{ github.ref }}-public_web
          provenance: true
          sbom: true

  build-ims-web:
    name: build-and-push (ims_web)
    needs: [changes, lint-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.changes.outputs.ims_web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-ims_web
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=ims
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_PUBLIC_URL=${{ vars.NEXT_PUBLIC_PUBLIC_URL }}
            NEXT_PUBLIC_IMS_URL=${{ vars.NEXT_PUBLIC_IMS_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ github.ref }}-ims_web
          cache-to: type=gha,mode=max,scope=${{ github.ref }}-ims_web
          provenance: true
          sbom: true

  build-pkkmb-web:
    name: build-and-push (pkkmb_web)
    needs: [changes, lint-and-test]
    # PKKMB keeps a fresh immutable image on every deploy (its runtime is
    # public-facing and must not silently reuse an older `latest` image), so it
    # also builds whenever a relevant shared file changes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.changes.outputs.pkkmb_web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-pkkmb_web
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=pkkmb
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_PUBLIC_URL=${{ vars.NEXT_PUBLIC_PUBLIC_URL }}
            NEXT_PUBLIC_IMS_URL=${{ vars.NEXT_PUBLIC_IMS_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ github.ref }}-pkkmb_web
          cache-to: type=gha,mode=max,scope=${{ github.ref }}-pkkmb_web
          provenance: true
          sbom: true

  build-api:
    name: build-and-push (api)
    needs: [changes, lint-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=backend
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_PUBLIC_URL=${{ vars.NEXT_PUBLIC_PUBLIC_URL }}
            NEXT_PUBLIC_IMS_URL=${{ vars.NEXT_PUBLIC_IMS_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ github.ref }}-api
          cache-to: type=gha,mode=max,scope=${{ github.ref }}-api
          provenance: true
          sbom: true
