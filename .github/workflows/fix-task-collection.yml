name: Fix Collection Penugasan (pkkmb_tasks -> pkkmbtasks)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pindahkan data task ke collection yang benar
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"
            MDB_URI=$(grep -E '^MONGODB_URI=' .env | head -n1 | cut -d= -f2-)

            echo "== count sebelum =="
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval '
              print("pkkmb_tasks (salah):", db.pkkmb_tasks.countDocuments({}));
              print("pkkmbtasks (benar):", db.pkkmbtasks.countDocuments({}));
              print("pkkmb_submissions (salah):", db.pkkmb_submissions.countDocuments({}));
              print("pkkmbsubmissions (benar):", db.pkkmbsubmissions.countDocuments({}));
            '

            echo "== pindahkan pkkmb_tasks -> pkkmbtasks =="
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval '
              const wrong = db.pkkmb_tasks.find({}).toArray();
              if (wrong.length > 0) {
                for (const doc of wrong) {
                  db.pkkmbtasks.updateOne(
                    { _id: doc._id },
                    { $set: doc },
                    { upsert: true }
                  );
                }
                db.pkkmb_tasks.deleteMany({});
                print("Dipindahkan:", wrong.length, "task -> pkkmbtasks");
              } else {
                print("pkkmb_tasks kosong, tidak ada yg dipindah");
              }
            '

            echo "== pindahkan pkkmb_submissions -> pkkmbsubmissions (bila ada) =="
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval '
              const wrong = db.pkkmb_submissions.find({}).toArray();
              if (wrong.length > 0) {
                for (const doc of wrong) {
                  db.pkkmbsubmissions.updateOne(
                    { _id: doc._id },
                    { $set: doc },
                    { upsert: true }
                  );
                }
                db.pkkmb_submissions.deleteMany({});
                print("Dipindahkan:", wrong.length, "submission -> pkkmbsubmissions");
              } else {
                print("pkkmb_submissions kosong atau tidak ada");
              }
            '

            echo "== count sesudah =="
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval '
              print("pkkmbtasks (benar):", db.pkkmbtasks.countDocuments({}));
              print("pkkmb_tasks (salah):", db.pkkmb_tasks.countDocuments({}));
              print("pkkmbsubmissions (benar):", db.pkkmbsubmissions.countDocuments({}));
            '
