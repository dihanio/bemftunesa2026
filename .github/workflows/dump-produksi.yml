name: Dump Data Maba & Gugus (VPS)

on:
  workflow_dispatch:

jobs:
  dump-produksi:
    runs-on: ubuntu-latest
    steps:
      - name: Jalankan dump di VPS (produksi)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"

            echo "→ Jalankan dump maba & gugus (produksi)"
            docker compose -f docker-compose.yml exec -T api \
              node dist/src/database/seeders/dump-maba-gugus.js

            echo "→ Salin hasil Excel dari container ke host"
            mkdir -p "$DEPLOY_PATH/backend/dump"
            docker compose -f docker-compose.yml cp api:/app/backend/dump/maba-pkkmb-full.xlsx "$DEPLOY_PATH/backend/dump/" || \
              docker compose -f docker-compose.yml cp api:/app/backend/dist/dump/maba-pkkmb-full.xlsx "$DEPLOY_PATH/backend/dump/" || echo "WARN: maba file tidak ditemukan"
            docker compose -f docker-compose.yml cp api:/app/backend/dump/gugus-pkkmb-full.xlsx "$DEPLOY_PATH/backend/dump/" || \
              docker compose -f docker-compose.yml cp api:/app/backend/dist/dump/gugus-pkkmb-full.xlsx "$DEPLOY_PATH/backend/dump/" || echo "WARN: gugus file tidak ditemukan"

            ls -la "$DEPLOY_PATH/backend/dump/"

      - name: Siapkan kunci SSH runner
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT || '22' }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Unduh file Excel dari VPS ke runner
        run: |
          set -euo pipefail
          mkdir -p ./dump
          PORT=${{ secrets.VPS_SSH_PORT || '22' }}
          scp -i ~/.ssh/id_vps -P "$PORT" -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEPLOY_PATH }}/backend/dump/maba-pkkmb-full.xlsx" ./dump/
          scp -i ~/.ssh/id_vps -P "$PORT" -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEPLOY_PATH }}/backend/dump/gugus-pkkmb-full.xlsx" ./dump/
          ls -la ./dump/

      - name: Upload hasil dump sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: dump-maba-gugus-produksi
          path: ./dump/
          if-no-files-found: error
