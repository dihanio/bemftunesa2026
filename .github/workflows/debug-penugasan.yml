name: Debug Penugasan Kosong (Maba)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debug penugasan untuk maba
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"
            MDB_URI=$(grep -E '^MONGODB_URI=' .env | head -n1 | cut -d= -f2-)

            echo "== user Fibrian + role =="
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval '
              const u = db.users.findOne({ name: /FIBRIAN/i });
              if (!u) { print("user tidak ada"); }
              else {
                printjson({ email: u.email, role: u.role, isOnboarded: u.isOnboarded });
                const r = db.roles.findOne({ _id: u.role });
                print("role slug: " + (r ? r.slug : "TIDAK ADA"));
              }
            '

            echo "== semua task PUBLISHED target ALL =="
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval '
              db.pkkmb_tasks.countDocuments({ deletedAt: null, status: "PUBLISHED", targetType: "ALL" })
            '

            echo "== detail task PUBLISHED (title, deadline, createdBy) =="
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval '
              db.pkkmb_tasks.find({ deletedAt: null, status: "PUBLISHED" }, { title: 1, deadline: 1, createdBy: 1, targetType: 1, assignmentType: 1 }).toArray()
            '
