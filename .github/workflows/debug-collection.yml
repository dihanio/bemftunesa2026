name: Debug nama collection Mongoose

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cek nama collection model task/quiz/attendance
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"
            docker compose -f docker-compose.yml exec -T api node -e '
              const { NestFactory } = require("@nestjs/core");
              const { AppModule } = require("./dist/src/app.module");
              (async () => {
                const app = await NestFactory.createApplicationContext(AppModule, { logger: false });
                const PkkmbService = require("./dist/src/pkkmb/pkkmb.service").PkkmbService;
                const svc = app.get(PkkmbService);
                console.log("taskModel.collection.name:", svc.taskModel.collection.name);
                console.log("quizModel.collection.name:", svc.quizModel.collection.name);
                const SessionModel = svc.attendanceModel || svc.sessionModel;
                if (SessionModel) console.log("sessionModel.collection.name:", SessionModel.collection.name);
                // cek data di semua koleksi terkait
                const m = require("mongoose");
                const list = await m.connection.db.listCollections().toArray();
                const names = list.map(c => c.name).filter(n => /task|quiz|attend|submission/i.test(n));
                console.log("koleksi terkait:", names);
                // hitung task di pkkmb_tasks vs pkkmbtasks
                const dbtasks = await m.connection.collection("pkkmb_tasks").countDocuments({});
                const tasks2 = await m.connection.collection("pkkmbtasks").countDocuments({});
                console.log("pkkmb_tasks count:", dbtasks, "| pkkmbtasks count:", tasks2);
                await app.close();
                process.exit(0);
              })().catch(e => { console.error("FATAL", e.message); process.exit(1); });
            '
