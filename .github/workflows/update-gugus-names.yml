name: Update Nama Gugus Adrata (VPS)

on:
  workflow_dispatch:

jobs:
  update-gugus-names:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update nama gugus di DB production
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"

            MDB_URI=$(grep -E '^MONGODB_URI=' .env | head -n1 | cut -d= -f2-)
            if [ -z "$MDB_URI" ]; then
              echo "❌ MONGODB_URI tidak ditemukan di .env"
              exit 1
            fi

            echo "======================================================"
            echo "Update nama 50 gugus sesuai daftar Adrata FT 2026"
            echo "======================================================"

            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval '
              const names = [
                "Majapahit","Sriwijaya","Singasari","Kediri","Medang","Mataram",
                "Kutai","Kalingga","Tarumanegara","Pajajaran","Kahuripan","Janggala",
                "Galuh","Panjalu","Kanjuruhan","Blambangan","Dharmasraya","Pagaruyung",
                "Demak","Pajang","Banten","Cirebon","Ternate","Tidore","Bacan","Jailolo",
                "Gowa","Bone","Luwu","Wajo","Soppeng","Buton","Banjar","Siak","Lamuri",
                "Indrapura","Kandis","Konawe","Banggai","Selaparang","Aceh Darussalam",
                "Lingga","Kutai Kartanegara","Melayu","Salakanagara","Sunda Galuh",
                "Bulungan","Aru","Sambas","Kutaringin"
              ];
              let updated = 0;
              names.forEach((n, idx) => {
                const res = db.pkkmb_gugus.updateOne(
                  { nomor: idx + 1 },
                  { $set: { name: n } }
                );
                if (res.matchedCount > 0) updated++;
              });
              print("Gugus diupdate: " + updated);
            '

            echo ""
            echo "→ Verifikasi: nama gugus saat ini (contoh 5 gugus pertama):"
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval 'db.pkkmb_gugus.find({}, { nomor: 1, name: 1 }).sort({ nomor: 1 }).limit(5).toArray()'
            echo ""
            echo "→ Total gugus ACTIVE:"
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval 'db.pkkmb_gugus.countDocuments({ status: "ACTIVE" })'
            echo "✅ Update nama gugus selesai."
