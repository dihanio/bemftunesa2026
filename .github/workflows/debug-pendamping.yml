name: Debug Data Pendamping (phone/WA)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cek field pendamping
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"
            MDB_URI=$(grep -E '^MONGODB_URI=' .env | head -n1 | cut -d= -f2-)
            echo "== contoh user pendamping (field lengkap) =="
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval '
              const p = db.users.findOne({ division: "Sie Pendamping" });
              print("field keys:", Object.keys(p || {}).join(", "));
              print("phone:", p.phone, "| pendampingWhatsApp:", p.pendampingWhatsApp, "| pendampingEmail:", p.pendampingEmail);
            '
            echo "== gugus 1: pendampingId & grupLink =="
            docker compose -f docker-compose.yml exec -T db mongosh "$MDB_URI" --quiet --eval '
              const g = db.pkkmb_gugus.findOne({ nomor: 1 });
              print("gugus1 pendampingId:", g.pendampingId, "| grupLink:", g.grupLink || "NULL");
            '
