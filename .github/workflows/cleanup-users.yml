name: Cleanup Users (manual)

on:
  workflow_dispatch:

jobs:
  cleanup_users_on_vps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run cleanup-users.js on VPS
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"

            echo "=> remote: pull latest (membawa backend/scripts/cleanup-users.js)"
            git fetch --all --prune
            git reset --hard origin/main || git pull --ff-only || true

            echo "=> remote: jalankan cleanup user PKKMB (cascade)"
            API_CID=$(docker compose -f docker-compose.yml ps -q api)
            docker cp "$DEPLOY_PATH/backend/scripts/cleanup-users.js" "$API_CID":/tmp/cleanup-users.js
            docker compose -f docker-compose.yml exec -T api node /tmp/cleanup-users.js || \
              echo "WARN: cleanup gagal — cek log di atas"
