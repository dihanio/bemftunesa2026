name: Debug Dashboard Loading

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cek log API & endpoint dashboard
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"
            echo "== 40 baris log API terakhir =="
            docker compose -f docker-compose.yml logs --tail=40 api 2>&1 || true
            echo ""
            echo "== test endpoint settings/public/links (tanpa auth) =="
            docker compose -f docker-compose.yml exec -T api sh -c 'timeout 10 curl -s -o /dev/null -w "HTTP %{http_code} time %{time_total}s\n" http://localhost:4000/api/v1/settings/public/links' 2>&1 || echo "TIMEOUT/HANG"
